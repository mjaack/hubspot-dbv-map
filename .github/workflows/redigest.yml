name: Weekly re-diff
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch specs
        run: python3 fetch_specs.py
      - name: Rebuild map
        run: python3 build_map.py
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- map.json MAP.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and open issue on change
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add map.json MAP.md
          git commit -m "Weekly re-diff: HubSpot spec changes detected"
          git push
          gh issue create \
            --title "HubSpot spec changes detected in weekly re-diff ($(date -u +%Y-%m-%d))" \
            --body "The weekly re-diff found changes in HubSpot's published OpenAPI specs since last run. See the diff in this commit's history for map.json / MAP.md."
